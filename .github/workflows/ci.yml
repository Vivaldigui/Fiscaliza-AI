name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fiscaliza:ci-only@localhost:5432/fiscaliza?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fiscaliza/database db:validate
      - run: pnpm --filter @fiscaliza/database db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  clean-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: fiscaliza
          POSTGRES_USER: fiscaliza
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscaliza -d fiscaliza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://fiscaliza:ci-only@localhost:5432/fiscaliza?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fiscaliza/database db:deploy
      - run: pnpm --filter @fiscaliza/database db:generate
      - run: pnpm --filter @fiscaliza/api... build
      - run: pnpm --filter @fiscaliza/api test:integration
      - run: pnpm --filter @fiscaliza/worker... build
      - run: pnpm --filter @fiscaliza/worker test:integration
